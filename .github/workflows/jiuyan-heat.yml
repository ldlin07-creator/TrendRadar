name: 韭研题材热度推送

# 周一到周五，北京时间 9:00-19:00 每小时跑一次（云端 GitHub Actions，不依赖本地电脑开机）
# 覆盖 A 股交易时段与盘后；半夜社区无讨论且不发邮件，故不安排。
# 抓取韭研公社 24h 热度上升最快题材，发现热点后自动深挖：
# 韭研 TOP3 + 题材分析师清单(config/analyst_themes.json，由本地桥接任务推送到仓库)，详情一并推送
# 推送渠道：邮件(HTML报告) / 企业微信 / 通用webhook / ntfy，取已配置的 Secrets
# GitHub Actions cron 用 UTC：北京 = UTC+8，故 UTC 1-11 点 = 北京 9-19 点；1-5 = 周一到周五
on:
  schedule:
    - cron: "0 1-11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: jiuyan-heat-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取分析并推送
        env:
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_FROM: ldlin07@126.com
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ldlin07@126.com
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
        run: |
          python tools/jiuyan_hot_theme.py \
            --json output/jiuyan_heat/latest.json \
            --report output/jiuyan_heat/latest.html \
            --deep-dive --deep-top 3 --deep-per 5 \
            --push
