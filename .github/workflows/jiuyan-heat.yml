name: 韭研题材热度推送

# 周一到周五运行（云端 GitHub Actions，不依赖本地电脑开机）
# 时间表：北京 8:00-16:00 每小时一次；盘中 9:30-11:30、13:00-15:00 加密到半小时一次
# 六路热点发现（多源探测器）：韭研公社 / 华尔街见闻 / 渠道归纳(财联社·头条·微博·知乎·雪球)
#   / 东方财富人气榜 / 新华财经(MCP桥接) / 通达信涨停(MCP桥接)，按热度上升分取 TOP
# 发现热点后自动深挖：多源 TOP3 + 题材分析师清单(config/analyst_themes.json)，详情一并推送
# 推送渠道：邮件(HTML报告) / 企业微信 / 通用webhook / ntfy，取已配置的 Secrets
# cron 用 UTC，北京 = UTC+8：
#   北京 8-16 点整  = UTC 0-8 点整   -> "0 0-8 * * 1-5"
#   盘中半点 9:30/10:30/11:30 = UTC 1:30/2:30/3:30 -> "30 1-3 * * 1-5"
#   盘中半点 13:30/14:30 = UTC 5:30/6:30 -> "30 5-6 * * 1-5"
on:
  schedule:
    - cron: "0 0-8 * * 1-5"
    - cron: "30 1-3 * * 1-5"
    - cron: "30 5-6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: jiuyan-heat-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取分析并推送
        env:
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_FROM: ldlin07@126.com
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ldlin07@126.com
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
        run: |
          python tools/jiuyan_hot_theme.py \
            --json output/jiuyan_heat/latest.json \
            --report output/jiuyan_heat/latest.html \
            --multi-source \
            --deep-dive --deep-top 3 --deep-per 5 \
            --push
