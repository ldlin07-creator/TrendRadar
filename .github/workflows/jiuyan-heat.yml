name: 全源热点关键词推送

# 周一到周五运行（云端 GitHub Actions，不依赖本地电脑开机）
# 时间表：北京 8:00-16:00 每小时一次；盘中 9:30-11:30、13:00-15:00 加密到半小时一次
# 六路热点发现（多源探测器）：韭研公社 / 华尔街见闻 / 渠道归纳(财联社·头条·微博·知乎·雪球)
#   / 东方财富人气榜 / 新华财经(MCP桥接) / 通达信涨停(MCP桥接)
# 发现层保留全部原始热点并动态归纳上升关键词，不按预设题材/题材分析师清单过滤
# 深挖层：归纳关键词 TOP3 + 题材分析师清单(config/analyst_themes.json)，详情一并推送
# 推送渠道：邮件(HTML报告) / 企业微信 / 通用webhook / ntfy，取已配置的 Secrets
# cron 用 UTC，北京 = UTC+8。
# 注意：GitHub Actions 定时任务在整点/半点高峰会被平台负载延迟甚至跳过，
# 故触发分钟一律错开 8 分钟（:08 / :38），实测同仓库错峰的 Get Hot News(:33) 稳定命中。
#   北京 8:08-16:08 每小时 = UTC 0:08-8:08   -> "8 0-8 * * 1-5"
#   盘中 9:38/10:38/11:38 = UTC 1:38/2:38/3:38 -> "38 1-3 * * 1-5"
#   盘中 13:38/14:38      = UTC 5:38/6:38      -> "38 5-6 * * 1-5"
on:
  schedule:
    - cron: "8 0-8 * * 1-5"
    - cron: "38 1-3 * * 1-5"
    - cron: "38 5-6 * * 1-5"
  workflow_dispatch:
    inputs:
      skip_push:
        description: "验证模式：只跑分析不推送邮件（夜间验证用，避免打扰）"
        type: boolean
        required: false
        default: false

concurrency:
  group: jiuyan-heat-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取分析并推送
        env:
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_FROM: ldlin07@126.com
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ldlin07@126.com
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
        run: |
          # 验证模式（手动触发并勾选 skip_push）不推送，避免夜间验证发邮件打扰
          PUSH_FLAG="--push"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_push }}" = "true" ]; then
            PUSH_FLAG=""
          fi
          python tools/jiuyan_hot_theme.py \
            --json output/jiuyan_heat/latest.json \
            --report output/jiuyan_heat/latest.html \
            --multi-source \
            --deep-dive --deep-top 3 --deep-per 5 \
            $PUSH_FLAG
